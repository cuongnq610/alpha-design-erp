name: ALPHA ERP v4.5.37 Staging Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run manifest:verify

  verify-staging:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      APP_URL: ${{ vars.STAGING_SITE_URL }}
      EXPECTED_VERSION: 4.5.37
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALPHA_COMPANY_ID: ${{ secrets.ALPHA_COMPANY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-remote-deployment.mjs
      - run: node scripts/verify-supabase-project.mjs
